name: GitHub-Profile-3D-Contrib

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "profile-3d-contrib/**"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Arjunren

      - name: Commit generated 3D contribution files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No 3D contribution changes to commit."
            exit 0
          fi

          git commit -m "chore: update 3D contribution calendar"
          git push
